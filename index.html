<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secret Code Generator</title>

<style>
    body {
        font-family: Arial;
        background: #0f172a;
        color: white;
        text-align: center;
        padding-top: 80px;
    }

    input {
        padding: 10px;
        width: 220px;
        font-size: 16px;
        border-radius: 6px;
        border: none;
    }

    button {
        padding: 10px 20px;
        margin-top: 10px;
        cursor: pointer;
        border-radius: 6px;
        border: none;
        background: #38bdf8;
        color: black;
        font-weight: bold;
    }

    .box {
        margin-top: 30px;
        background: #1e293b;
        padding: 20px;
        display: inline-block;
        border-radius: 10px;
        width: 80%;
        max-width: 600px;
        word-break: break-all;
    }

    .small {
        font-size: 12px;
        opacity: 0.7;
    }
</style>
</head>

<body>

<h1>🔐 Secret Code Generator</h1>

<input id="num" type="number" placeholder="Enter number">
<br>
<button onclick="generate()">Generate Code</button>

<div class="box">
    <h3>Output</h3>
    <p id="result">---</p>
    <p class="small">Changes every 30 seconds</p>
</div>

<script>
/* -------------------------------------------------------
   SECRET KEY (visible in frontend — NOT truly secure)
------------------------------------------------------- */
const SECRET_KEY = "MyHiddenKey_12345";

/* -------------------------------------------------------
   TIME BLOCK (changes every 30 seconds)
------------------------------------------------------- */
function timeBlock() {
    return Math.floor(Date.now() / 1000 / 30);
}

/* -------------------------------------------------------
   SHA-256 helper
------------------------------------------------------- */
async function sha256(text) {
    const encoder = new TextEncoder();
    const data = encoder.encode(text);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);

    return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
}

/* -------------------------------------------------------
   MAIN GENERATOR
------------------------------------------------------- */
async function generate() {
    let number = document.getElementById("num").value;
    let tb = timeBlock();

    let raw = number + "-" + tb + "-" + SECRET_KEY;

    let hash = await sha256(raw);

    document.getElementById("result").innerText =
        hash + "\n\n(Time block: " + tb + ")";
}
</script>

</body>
</html>
